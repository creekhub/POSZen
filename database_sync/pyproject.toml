[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poszen-database-sync"
version = "0.1.0"
description = "Bidirectional, conflict-safe synchronization between SQLite and MariaDB"
requires-python = ">=3.11"
dependencies = [
    "mariadb>=1.1.10",
]

[project.scripts]
poszen-db-sync = "database_sync.cli:main"

[tool.setuptools]
package-dir = {"" = ".."}
packages = ["database_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
